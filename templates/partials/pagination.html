{% if is_paginated %}
<nav class="pagination" aria-label="Сторінки">
    {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="pagination__link pagination__link--prev">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Назад</span>
        </a>
    {% else %}
        <span class="pagination__link pagination__link--prev" aria-disabled="true">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Назад</span>
        </span>
    {% endif %}

    <div class="pagination-list">
        <span class="pagination__link active">{{ page_obj.number }}</span>
        <span class="pagination__dots">з {{ page_obj.paginator.num_pages }}</span>
    </div>

    {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="pagination__link pagination__link--next">
            <span>Далі</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    {% else %}
        <span class="pagination__link pagination__link--next" aria-disabled="true">
            <span>Далі</span>
            <i class="fa-solid fa-arrow-right"></i>
        </span>
    {% endif %}
</nav>
{% endif %}

{% extends "base.html" %}
{% load static %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
    <div class="auth-background">
        <img src="{% static 'img/background/pattern.jpg' %}" alt="">
    </div>
    <div class="auth-form-container">
        <div class="auth-container auth-container--register">
            <div class="Legend">
                <h1 class="auth-title">Реєстрація</h1>
            </div>

            <form class="auth-form" id="register-form" method="post" action="{% url 'accounts:register' %}">
                {% csrf_token %}
                {% include "partials/form_errors.html" with form=form %}
                <div class="InputField">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ form.email.value|default:'' }}" class="Input" placeholder="" required>
                </div>
                <div class="InputField">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="Input" placeholder="" required>
                </div>

                <div class="CheckboxField">
                    <label class="checkbox-container">Запам’ятати мене
                        <input type="checkbox" name="remember_me" {% if form.remember_me.value %}checked{% endif %}>
                        <span class="checkmark"></span>
                    </label>
                </div>

                <div class="ButtonGroup">
                    <button type="submit" class="button button--primary">Зареєструватися</button>
                </div>
            </form>
            <p class="auth-switch">Вже є акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></p>
        </div>
    </div>
</main>
{% endblock %}

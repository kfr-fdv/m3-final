{% extends "base.html" %}
{% load static %}

{% block title %}Відновлення пароля{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <form class="auth-form" id="forgot-password-form" method="post" action="{% url 'accounts:password_reset' %}">
        {% csrf_token %}
        {% include "partials/form_errors.html" with form=form %}
        <div class="InputField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ form.email.value|default:'' }}" class="Input" placeholder="" required>
        </div>

        <div class="ButtonGroup ButtonGroup--center">
          <a href="{% url 'accounts:login' %}" class="button button--cancel">Скасувати</a>
          <button type="submit" class="button button--primary">Відновити пароль</button>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
